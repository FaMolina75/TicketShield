services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      APP_NAME: ${APP_NAME:-TicketShield}
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ticket}
      DB_USERNAME: ${DB_USERNAME:-ticket}
      DB_PASSWORD: ${DB_PASSWORD:-ticket}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  vite:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    environment:
      VITE_APP_NAME: ${APP_NAME:-TicketShield}
    ports:
      - "5173:5173"

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ticket}
      MYSQL_USER: ${DB_USERNAME:-ticket}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ticket}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
  vendor:
  node_modules: